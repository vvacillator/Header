name = "vvacillator/header"
version = "0.1.0"
authors = ["vvacillator"]
repository = "https://github.com/vvacillator/Header"
license = "MIT"

[target]
environment = "roblox"

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[scripts]
roblox_sync_config_generator = ".pesde/scripts/roblox_sync_config_generator.luau"
sourcemap_generator = ".pesde/scripts/sourcemap_generator.luau"

[dev_dependencies]
scripts = { name = "pesde/scripts_rojo", version = "^0.2.0", target = "lune" }
rojo = { name = "pesde/rojo", version = "^7.5.1", target = "lune" }

[engines]
pesde = "^0.7.0"
lune = "^0.10.2"

[dependencies]
react = { wally = "jsdotlua/react", version = "^17.2.1" }
react_roblox = { wally = "jsdotlua/react-roblox", version = "^17.2.1" }
charm = { wally = "littensy/charm", version = "^0.11.1" }
react_charm = { wally = "littensy/react-charm", version = "^0.4.1" }
